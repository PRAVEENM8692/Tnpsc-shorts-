name: post-existing-videos-to-telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = only list what would be posted, 0 = really post to the Telegram channel"
        default: "1"
      max_posts:
        description: "How many videos to post in this run"
        default: "80"

permissions:
  contents: write

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/telegram_backfill.py
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MAX_POSTS: ${{ github.event.inputs.max_posts }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TAVILY_API_KEY: "unused"
          LLM_API_KEY: "unused"
      - name: Remember what was posted
        if: always() && github.event.inputs.dry_run == '0'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add telegram_posted.json || true
          git diff --cached --quiet || (git commit -m "Update telegram_posted" && git pull --rebase -q && git push)
