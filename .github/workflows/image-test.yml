name: image-style-test
# Run by hand only: draws a few sample pictures in the long-video comic style. Uploads nothing to YouTube.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gradio_client
      - run: python tools/image_test.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-test
          path: out/image-test
      - name: Also keep the pictures on a side branch (image-test-out) so they can be viewed without the zip
        if: always()
        run: |
          cd out/image-test
          git init -q -b image-test-out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "sample pictures"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" image-test-out
