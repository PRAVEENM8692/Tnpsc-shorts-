name: story-upload
# Run by hand only: makes the thumbnail for the finished story video; with upload=true it also uploads the video to YouTube.
on:
  workflow_dispatch:
    inputs:
      name:
        default: "delhi1"
      upload:
        description: "true = upload to YouTube; false = only make the thumbnail"
        default: "false"
      playlist_only_id:
        description: "Only put this already-uploaded video (its YouTube id) into the Long videos playlist; nothing else is done"
        default: ""
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-dejavu-core
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Thumbnail and upload
        run: python tools/story/upload.py
        env:
          NAME: ${{ inputs.name }}
          UPLOAD: ${{ inputs.upload == 'true' && '1' || '0' }}
          PLAYLIST_ONLY_ID: ${{ inputs.playlist_only_id }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      - name: Keep the thumbnail on the side branch story-thumb so it can be viewed
        if: always()
        run: |
          mkdir keep && cp out/story/thumb.jpg keep/ 2>/dev/null || true
          cp out/story/uploaded.txt keep/ 2>/dev/null || true
          cd keep
          git init -q -b story-thumb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "thumbnail"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" story-thumb
