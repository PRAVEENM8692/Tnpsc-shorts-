name: my-voice-test
# Run by hand only: the owner's own voice as an AI voice (IndicF5, free, CPU). Uploads nothing to YouTube.
# The reference recording is kept ENCRYPTED in assets/myvoice/ref.enc (this repo is public); the key is the MYVOICE_KEY secret.
# Results are a workflow artifact kept for 1 day only.
on:
  workflow_dispatch:
    inputs:
      text_1:
        description: "Tamil line 1 (empty = built-in story line)"
        default: ""
      text_2:
        description: "Tamil line 2 (empty = built-in 40 s crime Short line)"
        default: ""
      engine:
        description: "auto = free HF GPU Space first, then CPU; space; cpu"
        default: "auto"
      test:
        description: "basic = 2 lines; moods = one line per mood with that mood's own reference clip"
        default: "moods"
permissions:
  contents: write
jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install IndicF5 (CPU)
        run: |
          pip install -r requirements.txt
          pip install torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install git+https://github.com/ai4bharat/IndicF5.git
          pip install "transformers==4.50.0" "datasets==3.6.0" soundfile numpy faster-whisper gradio_client
      - name: Decrypt the reference voice
        env:
          MYVOICE_KEY: ${{ secrets.MYVOICE_KEY }}
        run: |
          mkdir -p myvoice
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in assets/myvoice/ref.enc -out myvoice/ref.wav -pass env:MYVOICE_KEY
          if [ -d assets/myvoice/emo ]; then
            mkdir -p myvoice/emo
            for f in assets/myvoice/emo/*.enc; do b=$(basename "$f" .enc); [ "$b" = texts ] && o=myvoice/emo/texts.json || o=myvoice/emo/$b.wav
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$f" -out "$o" -pass env:MYVOICE_KEY; done
          fi
      - name: Make the samples
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REF_TEXT_FILE: assets/myvoice/ref_text.enc   # optional: exact words of the reference; if missing, Whisper writes them
          MYVOICE_KEY: ${{ secrets.MYVOICE_KEY }}
          TEXT_1: ${{ github.event.inputs.text_1 }}
          TEXT_2: ${{ github.event.inputs.text_2 }}
          MYVOICE_ENGINE: ${{ github.event.inputs.engine }}
        run: |
          if [ -f "$REF_TEXT_FILE" ]; then
            export REF_TEXT="$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$REF_TEXT_FILE" -pass env:MYVOICE_KEY)"
          fi
          if [ "${{ github.event.inputs.test }}" = "basic" ]; then python tools/voice_clone/indicf5_test.py; else python tools/voice_clone/mood_test.py; fi
      - uses: actions/upload-artifact@v4
        with:
          name: my-voice-samples
          path: out/*.mp3
          retention-days: 1
      - name: Keep an encrypted copy on the myvoice-samples branch (the repo is public; same MYVOICE_KEY)
        env:
          MYVOICE_KEY: ${{ secrets.MYVOICE_KEY }}
        run: |
          mkdir -p enc && for f in out/*.mp3; do openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "enc/$(basename "$f").enc" -pass env:MYVOICE_KEY; done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan myvoice-samples && git rm -rfq --cached . && git add enc && git commit -qm "encrypted voice samples ${GITHUB_RUN_ID}" && git push -f origin myvoice-samples
