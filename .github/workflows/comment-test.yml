name: comment-test

# One-off test: posts the question comment on ONE existing video, and prints the exact YouTube answer if it is refused.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true
      text:
        description: "Comment text"
        default: "இந்த வீடியோவில் உங்களுக்கு புரியாத பகுதி எது? கமெண்ட்ல சொல்லுங்க!"

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post the comment
        run: python -c "import os, pipeline as P; print('RESULT:', P.post_question_comment(os.environ['VID'], os.environ['TXT']))"
        env:
          VID: ${{ github.event.inputs.video_id }}
          TXT: ${{ github.event.inputs.text }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TAVILY_API_KEY: "unused"
          LLM_API_KEY: "unused"
