name: daily-tnpsc-short

on:
  schedule:
    # Wakes up every 30 minutes from 07:37 to 22:37 IST. plan.py picks the video that is due,
    # so a late or skipped GitHub run is caught up automatically.
    - cron: "7,37 2-17 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube? (true/false)"
        default: "false"
      slot:
        description: "Which video: 1-7, or all"
        default: "1"
      voice:
        description: "Voice for this run: gemini (default, needs GEMINI_API_KEY; falls back to free edge-tts) or edge (free only)"
        default: "gemini"

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # always the newest history.json, even when runs were queued together
      - name: Decide which video is due
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: python3 plan.py
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.slot != ''
        with:
          python-version: "3.12"
          cache: pip   # reuse downloaded Python packages between runs
          cache-dependency-path: requirements.txt
      - name: Install ffmpeg and Tamil fonts
        if: steps.plan.outputs.slot != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-dejavu-core && fc-list | grep -i "noto sans tamil" | head -2
      - run: pip install -r requirements.txt
        if: steps.plan.outputs.slot != ''
      - name: Install Manim (only for the animated aptitude videos)
        if: steps.plan.outputs.slot == '3' || steps.plan.outputs.slot == '4' || steps.plan.outputs.slot == '5' || steps.plan.outputs.slot == 'all'
        continue-on-error: true   # if this fails, the video falls back to AI images instead of stopping
        run: |
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config python3-dev
          pip install manim
      - name: Install the card and thumbnail renderer (all slots; thumbnails need it too)
        if: steps.plan.outputs.slot != ''
        continue-on-error: true   # if this fails, the video uses plain AI pictures instead of stopping
        run: |
          pip install playwright
          python -m playwright install chromium || true
      - name: Build and publish
        if: steps.plan.outputs.slot != ''
        run: python pipeline.py
        env:
          UPLOAD: ${{ github.event.inputs.upload || 'true' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MODEL_TA: ${{ vars.LLM_MODEL_TA }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_COMMENT: ${{ vars.YT_COMMENT }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
          GEMINI_STYLE: ${{ vars.GEMINI_STYLE }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          APT_RESEARCH: ${{ vars.APT_RESEARCH }}
          TTS_ENGINE: ${{ github.event.inputs.voice || vars.TTS_ENGINE }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SLOT: ${{ steps.plan.outputs.slot }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MANIM_SLOTS: ${{ vars.MANIM_SLOTS }}
          CARDS_SLOTS: ${{ vars.CARDS_SLOTS }}
          VOICES: ${{ vars.VOICES }}
          VOICE_VERIFY: ${{ vars.VOICE_VERIFY }}
          VOICE_MIN: ${{ vars.VOICE_MIN }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
      - name: Remember what was covered (avoids repeats)
        if: always() && steps.plan.outputs.slot != '' && (github.event_name == 'schedule' || github.event.inputs.upload == 'true')
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || (git commit -m "Update history" && git pull --rebase -q && git push)
      - name: Keep the output for review
        if: always() && steps.plan.outputs.slot != ''
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: out
          if-no-files-found: warn
          retention-days: 5
